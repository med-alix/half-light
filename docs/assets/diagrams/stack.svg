<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The XEN hyperstructure and the missing closure</title><defs><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a8998b"/></marker><marker id="ae" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#e8743b"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#3eb3a8"/></marker><marker id="ad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b08ce6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#d9b44a"/></marker><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#ffb35c"/></marker></defs><rect width="1000" height="560" rx="14" fill="#14110f"/>
<text x="500" y="46.0" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#f1e7dc" text-anchor="middle" font-weight="400">The hyperstructure and the missing closure</text>
<text x="500" y="74.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a8998b" text-anchor="middle" font-weight="400">Each layer rewards one verb. Nobody rewards keeping XEN for the winter, so NXN closes the loop.</text>
<rect x="60" y="140" width="200" height="80" rx="10" fill="#1f1a17" stroke="#b08ce6" stroke-width="1.5"/>
<text x="160.0" y="176.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">XEN</text>
<text x="160.0" y="196.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">mint: time + network growth</text>
<rect x="400" y="140" width="200" height="80" rx="10" fill="#1f1a17" stroke="#e8743b" stroke-width="1.5"/>
<text x="500.0" y="176.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">DBXen</text>
<text x="500.0" y="196.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">burn XEN, earn DXN</text>
<rect x="740" y="140" width="200" height="80" rx="10" fill="#1f1a17" stroke="#e8743b" stroke-width="1.5"/>
<text x="840.0" y="176.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">DXN stakers</text>
<text x="840.0" y="196.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">earn ETH fees</text>
<rect x="740" y="330" width="200" height="80" rx="10" fill="#1f1a17" stroke="#e8743b" stroke-width="1.5"/>
<text x="840.0" y="366.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">NXD</text>
<text x="840.0" y="386.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">compounds DXN fees</text>
<rect x="330" y="330" width="340" height="90" rx="10" fill="#1f1a17" stroke="#3eb3a8" stroke-width="1.5"/>
<text x="500.0" y="371.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#f1e7dc" text-anchor="middle" font-weight="600">Granary  →  NXN</text>
<text x="500.0" y="391.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">store XEN now, burn it after AMP = 1</text>
<path d="M 260 180 L 396 180" fill="none" stroke="#b08ce6" stroke-width="1.6" marker-end="url(#ad)"/>
<text x="328" y="170.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8998b" text-anchor="middle" font-weight="400">XEN burned</text>
<path d="M 600 180 L 736 180" fill="none" stroke="#e8743b" stroke-width="1.6" marker-end="url(#ae)"/>
<text x="668" y="170.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8998b" text-anchor="middle" font-weight="400">ETH fees</text>
<path d="M 840 220 L 840 326" fill="none" stroke="#e8743b" stroke-width="1.6" marker-end="url(#ae)"/>
<text x="852" y="278.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8998b" text-anchor="start" font-weight="400">buys + stakes DXN</text>
<path d="M 160 220 L 160 375 L 326 375" fill="none" stroke="#3eb3a8" stroke-width="1.6" marker-end="url(#aw)"/>
<text x="170" y="300.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8998b" text-anchor="start" font-weight="400">deposits</text>
<path d="M 500 330 L 500 224" fill="none" stroke="#3eb3a8" stroke-width="1.6" marker-end="url(#aw)"/>
<text x="512" y="280.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8998b" text-anchor="start" font-weight="400">release after the floor</text>
<rect x="60" y="460" width="880" height="64" rx="10" fill="none" stroke="#ffb35c" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="500" y="488.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#ffb35c" text-anchor="middle" font-weight="600">HALF-LIGHT, the game layer</text>
<text x="500" y="508.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a8998b" text-anchor="middle" font-weight="400">reads the chain and gives every mint, burn, stake and deposit a meaning: territory, rescues, the Reaping</text>
