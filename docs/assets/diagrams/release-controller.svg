<text x="830" y="330.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="start" font-weight="400">3 lots per cycle</text>
<text x="205" y="400.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="start" font-weight="400">pays only what</text>
<text x="205" y="418.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="start" font-weight="400">the market won't</text>
<text x="500" y="540.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">Before the floor only stake yield can be released; deposits are untouchable. Unsold allowance carries over up to 7 cycles.</text>
