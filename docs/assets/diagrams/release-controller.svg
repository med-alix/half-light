<path d="M 630 130 L 676 130" fill="none" stroke="#ffb35c" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 500 170 L 500 256" fill="none" stroke="#a8998b" stroke-width="1.6" marker-end="url(#am)"/>
<path d="M 366 300 L 324 300" fill="none" stroke="#a8998b" stroke-width="1.6" marker-end="url(#am)"/>
