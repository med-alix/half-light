<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Hybrid release: allowance, Hearth-lighting auction, small reserve</title><defs><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a8998b"/></marker><marker id="ae" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#e8743b"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#3eb3a8"/></marker><marker id="ad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b08ce6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#d9b44a"/></marker><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#ffb35c"/></marker></defs><rect width="1000" height="560" rx="14" fill="#14110f"/>
<text x="500" y="44.0" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#f1e7dc" text-anchor="middle" font-weight="400">Hybrid release: the market lights the Hearth, a small reserve covers the rest</text>
<rect x="60" y="90" width="260" height="80" rx="10" fill="#1f1a17" stroke="#3eb3a8" stroke-width="1.5"/>
<text x="190.0" y="126.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">Allowance this cycle</text>
<text x="190.0" y="146.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">½·gap (any era) + annuity (after floor)</text>
<rect x="370" y="90" width="260" height="80" rx="10" fill="#1f1a17" stroke="#ffb35c" stroke-width="1.5"/>
<text x="500.0" y="126.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">Hearth-lighting auction</text>
<text x="500.0" y="146.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">caller share rises 10% → 100% in 24 h</text>
<rect x="680" y="90" width="260" height="80" rx="10" fill="#1f1a17" stroke="#d9b44a" stroke-width="1.5"/>
<text x="810.0" y="126.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">Caller</text>
<text x="810.0" y="146.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">pays DBXen fee, keeps its share of DXN</text>
<rect x="370" y="260" width="260" height="80" rx="10" fill="#1f1a17" stroke="#4a3f37" stroke-width="1.5"/>
<text x="500.0" y="296.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">Unsold lots</text>
<text x="500.0" y="316.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">auction found no taker today</text>
<rect x="60" y="260" width="260" height="80" rx="10" fill="#1f1a17" stroke="#8fb8d8" stroke-width="1.5"/>
<text x="190.0" y="296.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">Small reserve (escrow)</text>
<text x="190.0" y="316.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">ETH from deposit energy fees</text>
<rect x="370" y="430" width="260" height="80" rx="10" fill="#1f1a17" stroke="#e8743b" stroke-width="1.5"/>
<text x="500.0" y="466.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f1e7dc" text-anchor="middle" font-weight="600">DBXen burn</text>
<text x="500.0" y="486.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400">only on cycles others also burn</text>
