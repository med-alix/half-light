<text x="500" y="465.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a8998b" text-anchor="middle" font-weight="400">Every in-game NXN cost is burned. Prices adjust each season by (target ÷ actual)^0.5, at most ±25%.</text>
<text x="500" y="486.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a8998b" text-anchor="middle" font-weight="400">Stake income from the Granary also buys and burns NXN (50% of it).</text>
