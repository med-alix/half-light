<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The tribes: three verbs and the market between them</title><defs><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a8998b"/></marker><marker id="ae" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#e8743b"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#3eb3a8"/></marker><marker id="ad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b08ce6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#d9b44a"/></marker><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#ffb35c"/></marker></defs><rect width="1000" height="730" rx="14" fill="#14110f"/>
<text x="500" y="44.0" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#f1e7dc" text-anchor="middle" font-weight="400">Three verbs, one fire</text>
<text x="500" y="70.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a8998b" text-anchor="middle" font-weight="400">Each tribe is one action of the hyperstructure. None of them survives alone.</text>
<circle cx="500" cy="385" r="290" fill="none" stroke="#d9b44a" stroke-width="1.2" stroke-dasharray="3 7"/>
<text x="500" y="707.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#d9b44a" text-anchor="middle" font-weight="400">Outlaws circle outside every tribe: mercenaries, raiders of the cold, free rescuers</text>
<circle cx="500" cy="195" r="82" fill="#1f1a17" stroke="#e8743b" stroke-width="2"/>
<text x="500.0" y="171.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#e8743b" text-anchor="middle" font-weight="600">Embers</text>
<text x="500.0" y="193.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f1e7dc" text-anchor="middle" font-weight="400">burn</text>
<text x="500.0" y="213.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400" font-style="italic">“fire now”</text>
<text x="500.0" y="237.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8998b" text-anchor="middle" font-weight="400">attack · war-burns</text>
<circle cx="665" cy="480" r="82" fill="#1f1a17" stroke="#3eb3a8" stroke-width="2"/>
<text x="664.5448267190434" y="456.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#3eb3a8" text-anchor="middle" font-weight="600">Wardens</text>
<text x="664.5448267190434" y="478.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f1e7dc" text-anchor="middle" font-weight="400">stake + store</text>
<text x="664.5448267190434" y="498.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400" font-style="italic">“fire later”</text>
<text x="664.5448267190434" y="522.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8998b" text-anchor="middle" font-weight="400">defend · Hearth</text>
<circle cx="335" cy="480" r="82" fill="#1f1a17" stroke="#b08ce6" stroke-width="2"/>
<text x="335.4551732809566" y="456.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#b08ce6" text-anchor="middle" font-weight="600">Drifters</text>
<text x="335.4551732809566" y="478.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f1e7dc" text-anchor="middle" font-weight="400">mint</text>
<text x="335.4551732809566" y="498.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8998b" text-anchor="middle" font-weight="400" font-style="italic">“new matter”</text>
<text x="335.4551732809566" y="522.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8998b" text-anchor="middle" font-weight="400">rescues · trade</text>
<line x1="544" y1="271" x2="621" y2="404" stroke="#4a3f37" stroke-width="1.4"/>
<line x1="577" y1="480" x2="423" y2="480" stroke="#4a3f37" stroke-width="1.4"/>
<line x1="379" y1="404" x2="456" y2="271" stroke="#4a3f37" stroke-width="1.4"/>
<circle cx="500" cy="395" r="46" fill="#2a1c12" stroke="#ffb35c" stroke-width="2"/>
<text x="500" y="391.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#ffb35c" text-anchor="middle" font-weight="600">Hearth</text>
<text x="500" y="410.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a8998b" text-anchor="middle" font-weight="400">shared fire</text>
</svg>